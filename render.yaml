services:
  - type: web
    name: rise966-realtime
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci
    startCommand: npm run server
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: PROVIDER
        value: tiktok
      - key: TIKTOK_UNIQUE_ID
        sync: false
      - key: SESSION_ID
        value: rise966
      - key: WEB_ORIGIN
        sync: false
      - key: CONTROL_TOKEN
        sync: false
      - key: OVERLAY_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: rise966-postgres
          property: connectionString
databases:
  - name: rise966-postgres
    region: oregon
    ipAllowList: []
