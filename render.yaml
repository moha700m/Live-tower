services:
  - type: web
    name: rise966-realtime
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm run server
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: PROVIDER
        value: mock
      - key: SESSION_ID
        value: rise966
      - key: WEB_ORIGIN
        value: https://localhost.invalid
      - key: CONTROL_TOKEN
        generateValue: true
      - key: OVERLAY_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: rise966-postgres
          property: connectionString
databases:
  - name: rise966-postgres
    plan: free
    region: frankfurt
    ipAllowList: []
